name: Update LeetCode Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch LeetCode stats
        run: |
          curl -fL --retry 3 \
            "https://leetcode-stats-api.herokuapp.com/raman1916" \
            -o leetcode.json

          echo "LeetCode API response:"
          cat leetcode.json

      - name: Update README
        run: |
          python3 <<'PY'
          import json
          import re

          with open("leetcode.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("status") != "success":
              raise RuntimeError(f"LeetCode API failed: {data}")

          easy = data["easySolved"]
          medium = data["mediumSolved"]
          hard = data["hardSolved"]
          total = data["totalSolved"]

          new_stats = f"""| Difficulty | Solved |
          |------------|-------:|
          | 🟢 Easy | {easy} |
          | 🟡 Medium | {medium} |
          | 🔴 Hard | {hard} |
          | **Total** | **{total}** |"""

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"<!-- LEETCODE_STATS_START -->.*?<!-- LEETCODE_STATS_END -->"

          replacement = (
              "<!-- LEETCODE_STATS_START -->\n"
              + new_stats
              + "\n<!-- LEETCODE_STATS_END -->"
          )

          updated = re.sub(
              pattern,
              replacement,
              readme,
              flags=re.DOTALL
          )

          if updated == readme:
              raise RuntimeError(
                  "Could not find LEETCODE_STATS_START/END markers in README.md"
              )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update LeetCode stats"
            git push
          fi
